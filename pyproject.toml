[project]
name = "dqsim"
version = "0.1.2"
description = "Rust-backed quantum circuit simulators with a circuit-feature-based simulator selector."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Felix Velasquez", email = "felixvelasquez1025@hotmail.com" },
]
dependencies = [
    "numpy>=1.26",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<1.8"]
qasm = ["qiskit>=2.5,<3"]
test = [
    "pytest>=8.0",
    "qiskit>=2.5,<3",
    "scikit-learn>=1.5,<1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
python-source = "python"
module-name = "dqsim._core"
